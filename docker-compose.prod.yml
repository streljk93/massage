# =============================================================================
# PRODUCTION — без MailHog, без публикации MinIO / Ollama наружу
# =============================================================================
# Отдельный проект Compose (`name` и имена томов с суффиксом `_prod`), чтобы на одной
# машине не пересечься с dev-стеком из `docker-compose.yml`.
#
# Запуск (из корня репозитория, с заполненным `.env` / секретами):
#   docker compose -f docker-compose.prod.yml up --build -d
#   npm run docker:up:prod
#
# Обязательно задать в окружении (корневой `.env` или CI secrets), как минимум:
#   POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_*, JWT_SECRET, AUTH_SECRET,
#   CLIENT_ORIGIN, AUTH_URL, NEXT_PUBLIC_API_URL (build client),
#   RESEND_API_KEY, MAIL_FROM (OTP в production; см. back mail.service),
#   при необходимости OLLAMA_*, MODERATION_*, S3_BUCKET, S3_REGION.
#
# Снаружи обычно reverse-proxy на client / back; порты по умолчанию 3000 / 3001 — при параллельном
# dev-стеке на том же хосте задайте CLIENT_PUBLISH_PORT / BACK_PUBLISH_PORT в `.env`.
# MinIO — только внутри сети (minio:9000).
# Ollama: профиль `ai` (сервис тяжёлый, ~6g RAM). Без `--profile ai` задайте `ENABLE_OLLAMA=true`
# только если реально есть доступный `OLLAMA_BASE_URL`; иначе `ENABLE_OLLAMA=false` (бэкенд не ходит в Ollama).
# Пример: `--profile ai` + `ENABLE_OLLAMA=true`, либо `npm run docker:up:prod:ai` (в скрипте уже true)
# и при необходимости `--profile backup`.
#
# Лимиты: `cpus` / `mem_limit` (compose v3+ на engine). Логи — json-file + rotate; Loki/ELK — отдельно.
# HTTP throttle / CORS — в приложении (Nest `ThrottlerModule`, `main.ts`).
#
# Бэкапы: профиль `backup` (сервис `postgres-backup`, том `postgres_backups`) или
# `npm run docker:pg-backup` / cron на хосте → ./backups/postgres/
# MinIO bucket: сервис `minio-init` создаёт `S3_BUCKET` после готовности MinIO.
# MinIO health: TCP `:9000` через `bash /dev/tcp` (в образе нет `nc`).
# Ollama health: `ollama list`, нет curl в образе; `start_period` — из‑за pull в entrypoint.
# NEXT_PUBLIC_* — build-args `client` (корневой `.env` + `build.args`); после смены — пересборка client (`build` / `up --build`).
# Postgres `PGDATA`: новый том; существующий кластер в корне volume — миграция или новый том.
# Архитектура: см. шапку `docker-compose.yml` (будущий ai-gateway vs tight coupling в back).
# Опционально: `read_only` + tmpfs / непривилегированный `user` — после проверки образов.

name: services-app-prod

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  minio:
    <<: *service-defaults
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      - internal
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -ce 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-services-uploads}
    networks:
      - internal
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2
        done
        if ! mc ls "local/$$S3_BUCKET" >/dev/null 2>&1; then
          mc mb -p "local/$$S3_BUCKET"
        fi

  ollama:
    <<: *service-defaults
    profiles:
      - ai
    init: true
    image: ollama/ollama:latest
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-compose-entrypoint.sh:/usr/local/bin/ollama-compose-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-compose-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    networks:
      - internal
    cpus: 2.0
    mem_limit: 6g

  image-moderation:
    <<: *service-defaults
    init: true
    build:
      context: ./docker/nsfw-image-moderation
      dockerfile: Dockerfile
    environment:
      PORT: "8085"
      FETCH_TIMEOUT_SEC: "45"
      MAX_IMAGE_BYTES: "12582912"
      MODERATION_CLIP_REVIEW_THRESHOLD: ${MODERATION_CLIP_REVIEW_THRESHOLD:-0.7}
      IMAGE_MODERATION_CLIP_ENABLED: ${IMAGE_MODERATION_CLIP_ENABLED:-true}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8085/healthz\")"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - internal
    cpus: 2.0
    mem_limit: 2g

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory "$${REDIS_MAXMEMORY:-256mb}" --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    cpus: 0.5
    mem_limit: 512m

  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      TZ: UTC
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-services}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    cpus: 1.0
    mem_limit: 1g

  postgres-backup:
    <<: *service-defaults
    profiles:
      - backup
    image: postgres:16-alpine
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-services}
      BACKUP_INTERVAL_SEC: ${POSTGRES_BACKUP_INTERVAL_SEC:-86400}
      POSTGRES_BACKUP_KEEP: ${POSTGRES_BACKUP_KEEP:-7}
    volumes:
      - postgres_backups:/backups
    networks:
      - internal
    cpus: 0.25
    mem_limit: 256m
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /backups
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          outfile="/backups/$${PGDATABASE}_$$ts.sql.gz"
          echo "[postgres-backup] $$outfile"
          pg_dump -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" "$$PGDATABASE" | gzip -c > "$$outfile"
          KEEP="$${POSTGRES_BACKUP_KEEP:-7}"
          cd /backups || exit 1
          ls -1t | awk -v "k=$$KEEP" 'NR>k {print}' | while IFS= read -r f; do
            rm -f "$$f"
          done
          sleep "$$BACKUP_INTERVAL_SEC"
        done

  back:
    <<: *service-defaults
    init: true
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "${BACK_PUBLISH_PORT:-3001}:3001"
    env_file:
      - path: ./back/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-services}?schema=public
      PORT: "3001"
      NODE_ENV: production
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-services-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ENABLE_OLLAMA: ${ENABLE_OLLAMA:-false}
      IMAGE_MODERATION_BASE_URL: ${IMAGE_MODERATION_BASE_URL:-http://image-moderation:8085}
      MODERATION_CLIP_REVIEW_THRESHOLD: ${MODERATION_CLIP_REVIEW_THRESHOLD:-0.7}
      MODERATION_FILE_FETCH_ORIGIN: ${MODERATION_FILE_FETCH_ORIGIN:-http://back:3001}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MODERATION_QUEUE_ENABLED: ${MODERATION_QUEUE_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
        required: false
      image-moderation:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(\"http\").get(\"http://127.0.0.1:3001/v1/health\", r => process.exit(r.statusCode===200?0:1)).on(\"error\",()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - internal
    cpus: 1.0
    mem_limit: 512m

  client:
    <<: *service-defaults
    init: true
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
    ports:
      - "${CLIENT_PUBLISH_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      AUTH_BACKEND_URL: http://back:3001
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
    depends_on:
      back:
        condition: service_healthy
    networks:
      - internal
    cpus: 1.0
    mem_limit: 512m

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    name: services-app_prod_postgres_data
  minio_data:
    name: services-app_prod_minio_data
  ollama_data:
    name: services-app_prod_ollama_data
  redis_data:
    name: services-app_prod_redis_data
  postgres_backups:
    name: services-app_prod_postgres_backups

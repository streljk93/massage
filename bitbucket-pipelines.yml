image: atlassian/default-image:4

pipelines:
  branches:
    main:
      - step:
          name: Deploy to production server
          deployment: production
          script:
            - test -n "$DEPLOY_HOST"
            - test -n "$DEPLOY_USER"
            - test -n "$DEPLOY_PATH"
            - export DEPLOY_PORT="${DEPLOY_PORT:-22}"
            - mkdir -p ~/.ssh && chmod 700 ~/.ssh
            - ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
            - |
              ssh -o IdentitiesOnly=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
                set -eu
                cd '$DEPLOY_PATH'
                git fetch origin main
                git checkout main
                git pull --ff-only origin main
                ENABLE_OLLAMA=true docker compose -f docker-compose.prod.yml --profile ai --profile backup up --build -d
              "

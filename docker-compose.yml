# Полный стек: Postgres + Nest (back) + Next.js (client).
#
# Первый раз с нуля (зависимости, секреты, Docker, OpenAPI-типы):
#   npm run init
#
# Запуск из корня репозитория:
#   npm run docker:env         — создать/обновить .env с JWT_SECRET + AUTH_SECRET для compose
#   npm run docker:bootstrap   — docker:env + поднять стек
#   docker compose up --build -d
#   npm run docker:up          — поднять стек (если .env уже есть)
#
# Данные PostgreSQL лежат в именованном volume `postgres_data` (см. внизу файла).
#   • `docker compose down` — останавливает контейнеры, **данные БД сохраняются**.
#   • `docker compose down -v` — удаляет volumes и **обнуляет БД** (осторожно).
#   • Редеплой образов: `docker compose up --build -d` — снова поднимается с тем же volume.
#
# Только база (для локальной разработки без сервисов из compose):
#   docker compose up postgres -d
#
# Почта: в `NODE_ENV=production` back шлёт только через Resend; в dev — только SMTP (MailHog).
# Локальная песочница: UI http://localhost:8025, SMTP 1025 — `docker compose up mailhog -d`
# back на хосте: в .env `SMTP_HOST=127.0.0.1`, `SMTP_PORT=1025` (без RESEND).
# Сервис `back` в compose ниже с NODE_ENV=development, чтобы письма шли в MailHog; реальный deploy — production + RESEND.
#
# Объекты (файлы) — MinIO: API http://localhost:9000, консоль http://localhost:9001
#   Логин/пароль по умолчанию: minioadmin / minioadmin
#
# Предмодерация текста — Ollama в Docker слушает с хоста http://localhost:11435 (внутри контейнера :11434, см. проброс ниже — не пересекается с нативным Ollama на :11434). Модель — entrypoint контейнера + `npm run init`.
#
# Отдельно — NSFW-бинарный классификатор для картинок витрины (docker/nsfw-image-moderation): http://localhost:8085,
# задаётся `IMAGE_MODERATION_BASE_URL`; Nest добавляет модерацию текстов тем же профилём после успешной проверки фото.
#
# Очередь BullMQ (фон модерации профиля организации): Redis `:6379` в compose как `redis`; `back` задаёт REDIS_HOST=redis при `MODERATION_QUEUE_ENABLED=true`.

name: services-app

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # Локальная LLM для предмодерации UGC (Nest → OLLAMA_BASE_URL в сервисе `back`).
  # Entrypoint поднимает сервер и выполняет `ollama pull` (OLLAMA_MODEL, по умолчанию llama3.2 — см. moderation-defaults.const.ts).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11435:11434"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-compose-entrypoint.sh:/usr/local/bin/ollama-compose-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-compose-entrypoint.sh"]

  # NSFW (NudeNet) + pairwise CLIP (violence…) для галереи салона — docker/nsfw-image-moderation, CPU.
  image-moderation:
    build:
      context: ./docker/nsfw-image-moderation
      dockerfile: Dockerfile
    restart: unless-stopped
    # Чтобы было имя хоста `host.docker.internal` (скачать файлы у Nest на хосте через MODERATION_FILE_FETCH_ORIGIN)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      FETCH_TIMEOUT_SEC: "45"
      MAX_IMAGE_BYTES: "12582912"
      MODERATION_CLIP_REVIEW_THRESHOLD: ${MODERATION_CLIP_REVIEW_THRESHOLD:-0.7}
      IMAGE_MODERATION_CLIP_ENABLED: ${IMAGE_MODERATION_CLIP_ENABLED:-true}

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: services
    ports:
      - "5432:5432"
    volumes:
      # Персистентное хранилище: переживает `docker compose down` и пересборки образов
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d services"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    # ADMIN_MASTER_* и прочие секреты Nest — в back/.env (`npm run init` дописывает суперадмина).
    env_file:
      - path: ./back/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/services?schema=public
      PORT: "3001"
      # dev: письма только через SMTP → MailHog. В K8s/prod оставьте NODE_ENV=production и RESEND_API_KEY.
      NODE_ENV: development
      # Публичный URL фронта (браузер). На VPS задайте в корневом `.env`: CLIENT_ORIGIN=http://IP:3000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      # В production JWT_SECRET обязателен; для локального compose — дефолт (смените в деплое)
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-secret-replace-in-real-deploy}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: services-uploads
      S3_REGION: us-east-1
      # Dev-only в коде: OTP через SMTP; MailHog в сети compose. Не production + Resend.
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      IMAGE_MODERATION_BASE_URL: ${IMAGE_MODERATION_BASE_URL:-http://image-moderation:8085}
      MODERATION_CLIP_REVIEW_THRESHOLD: ${MODERATION_CLIP_REVIEW_THRESHOLD:-0.7}
      MODERATION_FILE_FETCH_ORIGIN: ${MODERATION_FILE_FETCH_ORIGIN:-http://back:3001}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      MODERATION_QUEUE_ENABLED: ${MODERATION_QUEUE_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_started
      image-moderation:
        condition: service_started
      mailhog:
        condition: service_started
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Запекается в клиентский бандл при build. На VPS: в корневом `.env` NEXT_PUBLIC_API_URL=http://IP:3001 и `docker compose build client`
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Сервер Next (proxy /api/auth/register, Auth.js authorize) ходит в back по имени сервиса
      AUTH_BACKEND_URL: http://back:3001
      # Auth.js: канонический URL сайта. На VPS: AUTH_URL=http://IP:3000 в корневом `.env`
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-local-docker-authsecret-replace-in-real-deploy}
    depends_on:
      - back

volumes:
  postgres_data:
    name: services-app_postgres_data
  minio_data:
    name: services-app_minio_data
  ollama_data:
    name: services-app_ollama_data
  redis_data:
    name: services-app_redis_data

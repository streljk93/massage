# Полный стек: см. README и `npm run init`.
#
# Конфигурация в стиле типичного enterprise Compose:
# • Явная bridge-сеть `internal` — весь межсервисный трафик только в ней.
# • Несекретные инварианты стека (имена сервисов, AUTH_BACKEND_URL) — в YAML.
# • Секреты и среда приложения — корневой `.env` (`npm run docker:env`) и `back/.env` / `client/.env`.
# • Healthcheck API (`back`) и образ зависимостей по `service_healthy` где уместно.
# • Ротация json-file логов контейнеров.
#
# Запуск из корня: `docker compose up --build -d`
# Первичные секреты: `npm run docker:env`

name: services-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "4"

# Единый список env-файлов Nest в compose (порядок: приложение → корень для JWT и т.д.).
x-env-back: &env-back
  - path: ./back/.env
    required: false
  - path: .env
    required: false

networks:
  internal:
    driver: bridge

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "11435:11434"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-compose-entrypoint.sh:/usr/local/bin/ollama-compose-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-compose-entrypoint.sh"]

  image-moderation:
    build:
      context: ./docker/nsfw-image-moderation
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      FETCH_TIMEOUT_SEC: "45"
      MAX_IMAGE_BYTES: "12582912"
      MODERATION_CLIP_REVIEW_THRESHOLD: ${MODERATION_CLIP_REVIEW_THRESHOLD:-0.7}
      IMAGE_MODERATION_CLIP_ENABLED: ${IMAGE_MODERATION_CLIP_ENABLED:-true}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8085/healthz\")"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: services
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d services"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "3001:3001"
    env_file: *env-back
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3001/v1/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      image-moderation:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_started
      mailhog:
        condition: service_started

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Сервер Next ходит в Nest по DNS compose (не localhost хоста).
      AUTH_BACKEND_URL: http://back:3001
    env_file:
      - path: .env
        required: false
      - path: ./client/.env
        required: false
    depends_on:
      back:
        condition: service_healthy

volumes:
  postgres_data:
    name: services-app_postgres_data
  minio_data:
    name: services-app_minio_data
  ollama_data:
    name: services-app_ollama_data
  redis_data:
    name: services-app_redis_data

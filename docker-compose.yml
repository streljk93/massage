# Полный стек: см. README и `npm run init`.
#
# Конфигурация в стиле типичного enterprise Compose:
# • Явная bridge-сеть `internal` — весь межсервисный трафик только в ней.
# • Несекретные инварианты стека (имена сервисов, AUTH_BACKEND_URL) — в YAML.
# • Postgres: те же переменные, что официальный образ (`POSTGRES_*` в корневом `.env`); из них же собирается `DATABASE_URL` для `back`.
# • Healthcheck API (`back`) и образ зависимостей по `service_healthy` где уместно.
# • Ротация json-file логов контейнеров.
#
# Запуск из корня: `docker compose up --build -d`
# Первичные секреты: `npm run docker:env`

name: services-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "4"

# Единый список env-файлов Nest в compose (порядок: приложение → корень для JWT и т.д.).
x-env-back: &env-back
  - path: ./back/.env
    required: false
  - path: .env
    required: false

networks:
  internal:
    driver: bridge

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "11435:11434"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-compose-entrypoint.sh:/usr/local/bin/ollama-compose-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-compose-entrypoint.sh"]

  image-moderation:
    build:
      context: ./docker/nsfw-image-moderation
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8085:8085"
    environment:
      PORT: "8085"
      FETCH_TIMEOUT_SEC: "45"
      MAX_IMAGE_BYTES: "12582912"
      MODERATION_CLIP_REVIEW_THRESHOLD: ${MODERATION_CLIP_REVIEW_THRESHOLD:-0.7}
      IMAGE_MODERATION_CLIP_ENABLED: ${IMAGE_MODERATION_CLIP_ENABLED:-true}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8085/healthz\")"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-services}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-services}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "3001:3001"
    env_file: *env-back
    environment:
      # Те же логин/пароль/БД, что у сервиса `postgres` (корневой `.env`: POSTGRES_*).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-services}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://minio:9000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      IMAGE_MODERATION_BASE_URL: ${IMAGE_MODERATION_BASE_URL:-http://image-moderation:8085}
      MODERATION_FILE_FETCH_ORIGIN: ${MODERATION_FILE_FETCH_ORIGIN:-http://back:3001}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    healthcheck:
      # Без CMD-SHELL — меньше проблем с кавычками; в образе нет wget/curl.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      image-moderation:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_started
      mailhog:
        condition: service_started

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    ports:
      - "3000:3000"
    # Только Auth.js; не подключаем весь корневой `.env` — там креды Postgres и пр., им не нужны в Next.
    environment:
      NODE_ENV: production
      AUTH_BACKEND_URL: http://back:3001
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    env_file:
      - path: ./client/.env
        required: false
    depends_on:
      back:
        condition: service_healthy

volumes:
  postgres_data:
    name: services-app_postgres_data
  minio_data:
    name: services-app_minio_data
  ollama_data:
    name: services-app_ollama_data
  redis_data:
    name: services-app_redis_data
